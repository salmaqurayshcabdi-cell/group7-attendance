<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            color: #172554;
            font-weight: bold;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="form-container">

        <h2>Register New Student</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary mt-3">
                Save Student
            </button>
        </form>

        <a href="{% url 'student_list' %}" class="btn btn-outline-secondary mt-3 w-100">
            Back to Students
        </a>

    </div>
</div>

</body>
</html>
